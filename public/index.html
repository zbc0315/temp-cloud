<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Temp Cloud</title>
    <link rel="icon" href="icon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- A saturated colour field for the glass to sit over. Decorative only:
         without it the panels have nothing to refract and read as flat cards. -->
    <div class="field" aria-hidden="true">
      <span class="blob b1"></span>
      <span class="blob b2"></span>
      <span class="blob b3"></span>
      <span class="blob b4"></span>
    </div>

    <header class="bar">
      <div class="bar-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Temp Cloud</span>
          <span class="brand-status">
            <i class="dot" aria-hidden="true"></i>
            <span data-i18n="brandStatus">到期自动清理</span>
          </span>
        </div>
        <div class="bar-actions">
          <button type="button" id="language-toggle" class="pill">EN</button>
          <button type="button" id="theme-toggle" class="pill" data-i18n="themeToDark">深色</button>
        </div>
      </div>
    </header>

    <main class="app">
      <!-- ============ one composer: text, image and file share one box ===== -->
      <section class="sheet" aria-labelledby="composer-title">
        <div class="composer" id="composer">
          <div class="composer-empty">
            <svg
              class="composer-glyph"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5" />
              <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
            </svg>
            <p class="composer-title" id="composer-title" data-i18n="composerTitle">
              粘贴、拖入，或点按添加内容
            </p>
            <p class="composer-hint" data-i18n="composerHint">文本 · 图片 · 文件，都放在这里</p>
          </div>

          <textarea
            id="composer-input"
            class="composer-input"
            rows="3"
            data-i18n-placeholder="composerPlaceholder"
            data-i18n-aria="composerLabel"
            placeholder="也可以直接在这里输入或粘贴文字…"
          ></textarea>

          <div class="composer-tools">
            <button type="button" class="tool" id="pick-file">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M21 15V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h9" />
                <path d="M3 16.5 8 11l5 5" />
                <circle cx="15" cy="8" r="1.6" />
                <path d="M18 21v-6m0 0-2.2 2.2M18 15l2.2 2.2" />
              </svg>
              <span data-i18n="toolFile">选择文件</span>
            </button>
            <button type="button" class="tool" id="screenshot">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="5" width="18" height="14" rx="2.5" />
                <path d="M7 12h6M7 15.5h4" />
                <circle cx="17" cy="10" r="1.8" />
              </svg>
              <span data-i18n="toolScreenshot">截图</span>
            </button>
          </div>

          <input type="file" id="file-input" class="hidden" />
        </div>

        <div class="attachment-list" id="attachment-list"></div>

        <div class="options">
          <label class="field-text">
            <span class="field-label" data-i18n="fieldTitle">标题</span>
            <input
              type="text"
              id="title-input"
              maxlength="80"
              data-i18n-placeholder="placeholderTitle"
              placeholder="可选，例如：设计稿、验证码"
            />
          </label>
          <label class="field-text">
            <span class="field-label" data-i18n="fieldPassword">临时密码</span>
            <input
              type="text"
              id="password-input"
              data-i18n-placeholder="placeholderPassword"
              placeholder="留空即无密码"
            />
          </label>
          <label class="field-text">
            <span class="field-label" data-i18n="fieldExpire">保存时间</span>
            <select id="expires-hours"></select>
          </label>
        </div>

        <button type="button" class="save" id="save" data-i18n="save">保存</button>
        <p class="status" id="composer-status" role="status" aria-live="polite"></p>
      </section>

      <!-- ============ password lookup ====================================== -->
      <section class="sheet lookup" aria-labelledby="lookup-title">
        <div class="list-head">
          <h2 id="lookup-title" data-i18n="protectedSectionTitle">密码内容</h2>
          <span class="count" id="protected-caption" data-i18n="protectedCaptionDefault">
            输入密码后显示
          </span>
        </div>
        <form class="lookup-form" id="password-form">
          <input
            class="lookup-input"
            type="text"
            name="password"
            data-i18n-placeholder="placeholderLookupPassword"
            data-i18n-aria="lookupLabel"
            placeholder="输入密码查看对应内容"
          />
          <button type="submit" data-i18n="view">查看</button>
        </form>
        <p class="status" id="password-status" role="status" aria-live="polite"></p>
        <div class="list-section hidden" id="protected-section">
          <div id="protected-list"></div>
        </div>
      </section>

      <!-- ============ public list ========================================= -->
      <section class="list" aria-labelledby="public-title">
        <div class="list-head">
          <h2 id="public-title" data-i18n="publicSectionTitle">无密码内容</h2>
          <button type="button" class="pill" id="refresh-public" data-i18n="refresh">刷新</button>
        </div>
        <div id="public-list"></div>
      </section>
    </main>

    <template id="item-template">
      <article class="row">
        <span class="row-kind"></span>
        <div class="row-main">
          <h3 class="row-title"></h3>
          <p class="row-meta"></p>
        </div>
        <span class="row-expire"></span>
        <div class="row-actions"></div>
      </article>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
